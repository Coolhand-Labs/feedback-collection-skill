name: Check skill URLs

on:
  push:
    branches: [main]
    paths:
      - "skills/**/SKILL.md"
      - "skills/**/references/*.md"
      - "bin/check-skill-urls"
      - ".github/workflows/check-skill-urls.yml"
  pull_request:
    paths:
      - "skills/**/SKILL.md"
      - "skills/**/references/*.md"
      - "bin/check-skill-urls"
      - ".github/workflows/check-skill-urls.yml"
  schedule:
    # Weekly Monday 12:00 UTC — catches URL rot independent of code changes.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bin/check-skill-urls --self-test
      - run: bin/check-skill-urls
