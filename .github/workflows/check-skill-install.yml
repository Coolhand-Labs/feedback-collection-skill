name: Check skill install

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Tuesday 12:00 UTC — catches ecosystem breakage independent of code changes.
    - cron: "0 12 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install skills CLI (npm install -g skills)
        run: npm install -g skills

      - name: Install all four skills from this repo (skills add . --copy --yes)
        run: skills add . --copy --yes
        # --copy avoids symlink issues on CI; --yes skips interactive skill-selection prompt

      - name: Verify all four skills are present under .claude/skills/
        run: |
          MISSING=()
          for skill in feedback-collection coolhand-integration self-hosted-feedback wildcard-tool; do
            if [ ! -f ".claude/skills/${skill}/SKILL.md" ]; then
              MISSING+=("$skill")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "Missing skills: ${MISSING[*]}"
            exit 1
          fi
          echo "All four skills installed successfully."
